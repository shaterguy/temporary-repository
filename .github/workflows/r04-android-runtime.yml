name: r04-arm64-system-image-preflight

on:
  push:
    branches: ['verify/r04-android-runtime']
    paths:
      - '.github/workflows/r04-android-runtime.yml'
      - 'docs/verification/R04_ANDROID_RUNTIME.md'

permissions:
  contents: read

concurrency:
  group: r04-android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-system-image-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_SHA: eb4b542275f13929334d72cc4e3eba492bb8ef9c
      ARM_IMAGE: system-images;android-30;google_apis;arm64-v8a
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Test contract and action preflight
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_SHA" HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/r04-android-runtime.yml'
          test "${changed[1]}" = 'docs/verification/R04_ANDROID_RUNTIME.md'
          test "$(jq -r '.android.primary_abi' toolchain.lock)" = arm64-v8a
          grep -Fq 'TEST_CONTRACT_PREFLIGHT_STATUS=PASS' docs/verification/R04_ANDROID_RUNTIME.md
          grep -Fq 'ACTION_PREFLIGHT_STATUS=PASS' docs/verification/R04_ANDROID_RUNTIME.md
          grep -Fq 'PREVENTION_COMPLIANCE_STATUS=PASS' docs/verification/R04_ANDROID_RUNTIME.md
          echo TEST_CONTRACT_PREFLIGHT=VALID
          echo ACTION_PREFLIGHT=VALID
          echo R04_PRODUCT_DIFF=UNCHANGED

      - name: Probe ARM64 system image on x64 host without translation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r04-arm64-preflight
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          "$EMULATOR" -version | tee /tmp/r04-arm64-preflight/emulator-version.txt
          "$SDKMANAGER" --list --channel=0 > /tmp/r04-arm64-preflight/sdk-list.txt
          grep -F "$ARM_IMAGE" /tmp/r04-arm64-preflight/sdk-list.txt | tee /tmp/r04-arm64-preflight/arm-image-match.txt
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools emulator "$ARM_IMAGE" >/tmp/r04-arm64-preflight/sdk-install.txt
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo no | "$AVDMANAGER" create avd --force --name r04_arm64_api30 --package "$ARM_IMAGE" --device pixel_2 | tee /tmp/r04-arm64-preflight/avd-create.txt
          if test -d "$HOME/.config/.android/avd/r04_arm64_api30.avd"; then
            export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          else
            export ANDROID_AVD_HOME="$HOME/.android/avd"
          fi
          "$EMULATOR" -list-avds | tee /tmp/r04-arm64-preflight/avd-list.txt
          "$EMULATOR" -list-avds | grep -Fxq r04_arm64_api30
          find "$ANDROID_HOME/emulator/qemu" -maxdepth 2 -type f -name 'qemu-system-*' -printf '%P\n' | sort | tee /tmp/r04-arm64-preflight/qemu-binaries.txt
          adb kill-server || true
          adb start-server
          nohup "$EMULATOR" -avd r04_arm64_api30 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader -accel off -memory 3072 -cores 2 > /tmp/r04-arm64-preflight/emulator.log 2>&1 &
          echo $! >/tmp/r04-arm64-preflight/emulator.pid
          if ! timeout 120s adb wait-for-device; then
            cat /tmp/r04-arm64-preflight/emulator.log
            echo R04_X64_HOST_ARM64_GUEST=UNAVAILABLE
            exit 21
          fi
          booted=0
          for _ in $(seq 1 90); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then booted=1; break; fi
            sleep 2
          done
          if test "$booted" != 1; then
            adb shell getprop > /tmp/r04-arm64-preflight/getprop-timeout.txt || true
            cat /tmp/r04-arm64-preflight/emulator.log
            echo R04_X64_HOST_ARM64_GUEST=BOOT_TIMEOUT
            exit 22
          fi
          abi="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          printf 'sdk=%s\nprimary_abi=%s\n' "$sdk" "$abi" | tee /tmp/r04-arm64-preflight/guest.txt
          test "$sdk" = 30
          test "$abi" = arm64-v8a
          echo R04_X64_HOST_ARM64_GUEST=PASS

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lanternfall-r04-arm64-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/r04-arm64-preflight/
          if-no-files-found: warn
          retention-days: 14
