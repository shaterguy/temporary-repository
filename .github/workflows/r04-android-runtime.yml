name: r04-android-native-arm-preflight

on:
  push:
    branches: ['verify/r04-android-runtime']
    paths:
      - '.github/workflows/r04-android-runtime.yml'
      - 'docs/verification/R04_ANDROID_RUNTIME.md'

permissions:
  contents: read

concurrency:
  group: r04-native-arm-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm-host-preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    env:
      PRODUCT_SHA: eb4b542275f13929334d72cc4e3eba492bb8ef9c
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Product immutability preflight
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_SHA" HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/r04-android-runtime.yml'
          test "${changed[1]}" = 'docs/verification/R04_ANDROID_RUNTIME.md'
          test "$(jq -r '.android.primary_abi' toolchain.lock)" = arm64-v8a
          test "$(jq -r '.identity.prod_application_id' toolchain.lock)" = com.shaterguy.lanternfall
          echo TEST_CONTRACT_PREFLIGHT=VALID
          echo R04_PRODUCT_DIFF=UNCHANGED

      - name: Native ARM64 host and KVM capability preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r04-arm-preflight
          {
            echo "runner_arch=$(uname -m)"
            echo "kernel=$(uname -r)"
            echo "os=$( . /etc/os-release; echo "$PRETTY_NAME" )"
            echo "nproc=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
          } | tee /tmp/r04-arm-preflight/host.txt
          test "$(uname -m)" = aarch64
          if test ! -e /dev/kvm; then
            echo 'R04_NATIVE_ARM_KVM=UNAVAILABLE' | tee /tmp/r04-arm-preflight/kvm.txt
            exit 21
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm | tee /tmp/r04-arm-preflight/kvm.txt
          test -r /dev/kvm
          test -w /dev/kvm
          java -version 2>&1 | tee /tmp/r04-arm-preflight/java.txt
          python3 --version | tee /tmp/r04-arm-preflight/python.txt
          curl --version | head -n 1 | tee /tmp/r04-arm-preflight/curl.txt
          sudo apt-get update -qq
          apt-cache policy adb qemu-system-arm qemu-system-aarch64 2>/dev/null | tee /tmp/r04-arm-preflight/apt-policy.txt || true
          echo ACTION_PREFLIGHT=VALID
          echo R04_NATIVE_ARM_RUNNER=PASS
          echo R04_NATIVE_ARM_KVM=PASS

      - name: Upload ARM host preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lanternfall-r04-native-arm-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/r04-arm-preflight/
          if-no-files-found: warn
          retention-days: 14
