name: w05-runtime-fix

on:
  push:
    branches:
      - 'work/sr-20260911-medieval-rebuild'
    paths:
      - '.github/workflows/w05-runtime-fix.yml'

permissions:
  contents: write

concurrency:
  group: w05-runtime-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-runtime-ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Guard repair baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0e8c0597af97830fb38e95607ab764e0c2c09f44"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/w05-runtime-fix.yml"

      - name: Repair projectile tree ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game/presentation/medieval_combat_visuals_2_5d.gd')
          text = path.read_text()
          old = '''    projectile.scale = Vector3.ONE * scale_factor\n    projectile.position = origin\n    if origin.distance_squared_to(target) > 0.0001:\n        projectile.look_at(target, Vector3.UP)\n    _effect_root.add_child(projectile)\n    return projectile\n'''
          new = '''    projectile.scale = Vector3.ONE * scale_factor\n    _effect_root.add_child(projectile)\n    projectile.position = origin\n    if origin.distance_squared_to(target) > 0.0001:\n        projectile.look_at(target, Vector3.UP)\n    return projectile\n'''
          if text.count(old) != 1:
              raise SystemExit('projectile ordering contract drifted')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n -A6 -B2 'projectile.scale = Vector3.ONE' game/presentation/medieval_combat_visuals_2_5d.gd

      - name: Commit source repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/presentation/medieval_combat_visuals_2_5d.gd
          test "$(git diff --cached --name-only)" = "game/presentation/medieval_combat_visuals_2_5d.gd"
          git commit -m "fix(w05): attach projectiles before orienting them"
          git push origin HEAD:work/sr-20260911-medieval-rebuild
