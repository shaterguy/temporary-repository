name: w05-runtime-fix

on:
  push:
    branches:
      - 'work/sr-20260911-medieval-rebuild'
    paths:
      - '.github/workflows/w05-runtime-fix.yml'

permissions:
  contents: write

concurrency:
  group: w05-runtime-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-runtime-ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Guard repair baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fe385d6502d2b912a4fcb1122a2e4381dc5a9922"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/w05-runtime-fix.yml"

      - name: Repair projectile tree ordering and CI error gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('game/presentation/medieval_combat_visuals_2_5d.gd')
          script = script_path.read_text()
          old = '''    projectile.scale = Vector3.ONE * scale_factor\n    projectile.position = origin\n    if origin.distance_squared_to(target) > 0.0001:\n        projectile.look_at(target, Vector3.UP)\n    _effect_root.add_child(projectile)\n    return projectile\n'''
          new = '''    projectile.scale = Vector3.ONE * scale_factor\n    _effect_root.add_child(projectile)\n    projectile.position = origin\n    if origin.distance_squared_to(target) > 0.0001:\n        projectile.look_at(target, Vector3.UP)\n    return projectile\n'''
          if script.count(old) != 1:
              raise SystemExit('projectile ordering contract drifted')
          script_path.write_text(script.replace(old, new, 1))

          workflow_path = Path('.github/workflows/w05-combat-visual-ci.yml')
          workflow = workflow_path.read_text()
          old_gate = "if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:'"
          new_gate = "if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:|Node not inside tree|GDScript backtrace'"
          if workflow.count(old_gate) != 3:
              raise SystemExit(f'expected 3 W05 error gates, found {workflow.count(old_gate)}')
          workflow_path.write_text(workflow.replace(old_gate, new_gate))
          PY

          grep -n -A6 -B2 'projectile.scale = Vector3.ONE' game/presentation/medieval_combat_visuals_2_5d.gd
          grep -n 'Node not inside tree' .github/workflows/w05-combat-visual-ci.yml

      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/w05-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | grep -c '^game/presentation/medieval_combat_visuals_2_5d.gd$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^.github/workflows/w05-combat-visual-ci.yml$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^.github/workflows/w05-runtime-fix.yml$')" -eq 1
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 3
          git commit -m "fix(w05): eliminate off-tree projectile orientation errors"
          git push origin HEAD:work/sr-20260911-medieval-rebuild
