name: W04 Vendor Medieval Landmarks

on:
  push:
    branches:
      - work/sr-20260911-medieval-rebuild
    paths:
      - .github/workflows/w04-vendor-landmarks.yml

permissions:
  contents: write

concurrency:
  group: w04-vendor-landmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[vendor-w04]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: work/sr-20260911-medieval-rebuild
          fetch-depth: 1

      - name: Download pinned KayKit landmark and route assets
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit='84fa4e91af6a88989be7c99e0891cede11f2ca38'
          root='https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/'"${upstream_commit}"'/addons/kaykit_medieval_hexagon_pack/Assets/gltf'
          download() {
            local upstream="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --retry 3 --silent --show-error "${root}/${upstream}" --output "$target"
          }
          download 'buildings/blue/building_home_A_blue.gltf' 'assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_home_A_blue.gltf'
          download 'buildings/blue/building_home_A_blue.bin' 'assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_home_A_blue.bin'
          download 'buildings/blue/building_church_blue.gltf' 'assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_church_blue.gltf'
          download 'buildings/blue/building_church_blue.bin' 'assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_church_blue.bin'
          download 'buildings/blue/hexagons_medieval.png' 'assets/third_party/kaykit_medieval_hexagon/landmarks/blue/hexagons_medieval.png'
          download 'buildings/neutral/building_bridge_A.gltf' 'assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/building_bridge_A.gltf'
          download 'buildings/neutral/building_bridge_A.bin' 'assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/building_bridge_A.bin'
          download 'buildings/neutral/hexagons_medieval.png' 'assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/hexagons_medieval.png'
          download 'tiles/roads/hex_road_A.gltf' 'assets/third_party/kaykit_medieval_hexagon/terrain/roads/hex_road_A.gltf'
          download 'tiles/roads/hex_road_A.bin' 'assets/third_party/kaykit_medieval_hexagon/terrain/roads/hex_road_A.bin'
          download 'tiles/roads/hexagons_medieval.png' 'assets/third_party/kaykit_medieval_hexagon/terrain/roads/hexagons_medieval.png'
          download 'tiles/rivers/hex_river_A.gltf' 'assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_A.gltf'
          download 'tiles/rivers/hex_river_A.bin' 'assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_A.bin'
          download 'tiles/rivers/hex_river_crossing_A.gltf' 'assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_crossing_A.gltf'
          download 'tiles/rivers/hex_river_crossing_A.bin' 'assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_crossing_A.bin'
          download 'tiles/rivers/hexagons_medieval.png' 'assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hexagons_medieval.png'
          download 'tiles/base/hex_grass_sloped_high.gltf' 'assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hex_grass_sloped_high.gltf'
          download 'tiles/base/hex_grass_sloped_high.bin' 'assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hex_grass_sloped_high.bin'
          download 'tiles/base/hexagons_medieval.png' 'assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hexagons_medieval.png'

      - name: Verify immutable upstream Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "blob mismatch: $path expected=$expected actual=$actual" >&2; exit 1; }
          }
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_home_A_blue.gltf 885c5741a74ac355cdf136d7d6753d0ac0eb0568
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_home_A_blue.bin e39e8b69221983fa326441b148cfe06318aa6720
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_church_blue.gltf df0c0308da6d739ecadefa731385d66b0e5cc916
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/blue/building_church_blue.bin 7ed9f2419a33cc2cf6ddf88544939facb15ecf03
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/blue/hexagons_medieval.png 14cdc253646e4dba3cb7a267a6f7399b78ba2231
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/building_bridge_A.gltf df1ed184db0f1f8aade09280fd52017ff6fa3d6b
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/building_bridge_A.bin e069007b0a5ed7a05924353be9f591fe48032fe7
          check_blob assets/third_party/kaykit_medieval_hexagon/landmarks/neutral/hexagons_medieval.png 14cdc253646e4dba3cb7a267a6f7399b78ba2231
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/roads/hex_road_A.gltf 1de60d28b32742161229764d00d969dc6284d2d3
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/roads/hex_road_A.bin 518d3a050387bfedc7c145e74b44fd2e5c3e6fc5
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/roads/hexagons_medieval.png 14cdc253646e4dba3cb7a267a6f7399b78ba2231
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_A.gltf befc84d61ce2e09865b4cf34f7ea3e31c925ad79
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_A.bin 7b33f4ba61279278c723b3ebec6af57b6ac0e0ba
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_crossing_A.gltf 23353abf1cd8b6110a215d3f242edd2d9ea518f1
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hex_river_crossing_A.bin f6b94a4c839cb532d08c1582836ca2c36b1573d4
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/rivers/hexagons_medieval.png 14cdc253646e4dba3cb7a267a6f7399b78ba2231
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hex_grass_sloped_high.gltf 08f88dc13291f32fb60cbdea94695fce9e482cd1
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hex_grass_sloped_high.bin 4f491e464f6a8dd2d16fbd662fb4f5081d3d4d0c
          check_blob assets/third_party/kaykit_medieval_hexagon/terrain/elevation/hexagons_medieval.png 14cdc253646e4dba3cb7a267a6f7399b78ba2231

      - name: Commit vendored assets to the working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/third_party/kaykit_medieval_hexagon/landmarks assets/third_party/kaykit_medieval_hexagon/terrain/roads assets/third_party/kaykit_medieval_hexagon/terrain/rivers assets/third_party/kaykit_medieval_hexagon/terrain/elevation
          git diff --cached --quiet && { echo 'No asset changes to commit.'; exit 0; }
          git commit -m 'assets(w04): vendor landmark and route geometry'
          git push origin HEAD:work/sr-20260911-medieval-rebuild
