name: w05-combat-visual-ci

on:
  push:
    branches:
      - 'work/sr-20260911-medieval-rebuild'
    paths:
      - 'assets/third_party/kaykit_adventurers/**'
      - 'assets/licenses/W05_KAYKIT_ADVENTURERS.md'
      - 'game/presentation/medieval_combat_visuals_2_5d.gd'
      - 'game/ui/main_shell_medieval_rebuild.gd'
      - 'game/ui/main_shell.tscn'
      - 'tests/ci/test_w05_combat_visuals.gd'
      - 'tests/visual/capture_w05_combat_visuals.gd'
      - '.github/workflows/w05-combat-visual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w05-combat-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-combat-readability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ARCHIVE_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_ARCHIVE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      GODOT_BIN: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: W05 contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.engine.version' toolchain.lock)" = "$GODOT_VERSION"
          test "$(jq -r '.engine.linux_x86_64_sha256' toolchain.lock)" = "$GODOT_ARCHIVE_SHA256"
          test -s assets/third_party/kaykit_adventurers/characters/Knight.glb
          test -s assets/third_party/kaykit_adventurers/characters/Barbarian.glb
          test -s assets/third_party/kaykit_adventurers/characters/Mage.glb
          test -s assets/third_party/kaykit_adventurers/characters/Rogue_Hooded.glb
          test -s assets/third_party/kaykit_adventurers/weapons/sword_1handed.gltf
          test -s assets/third_party/kaykit_adventurers/weapons/crossbow_1handed.gltf
          test -s assets/third_party/kaykit_adventurers/weapons/staff.gltf
          test -s assets/third_party/kaykit_adventurers/weapons/dagger.gltf
          test -s assets/third_party/kaykit_adventurers/weapons/arrow.gltf
          test -s assets/third_party/kaykit_adventurers/LICENSE.txt
          test -s assets/licenses/W05_KAYKIT_ADVENTURERS.md
          test ! -e .github/workflows/w05-asset-import.yml
          grep -Fq 'MedievalCombatVisuals3D' game/ui/main_shell.tscn
          grep -Fq 'record_weapon_action' game/ui/main_shell_medieval_rebuild.gd
          grep -Fq 'causal_stages' game/presentation/medieval_combat_visuals_2_5d.gd
          grep -Fq 'trigger", "travel", "impact", "damage", "death' game/presentation/medieval_combat_visuals_2_5d.gd

      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --proto '=https' --tlsv1.2 "$GODOT_ARCHIVE_URL" --output /tmp/godot.zip
          echo "$GODOT_ARCHIVE_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -euo pipefail
          import_log="$(mktemp)"
          set +e
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee "$import_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$import_log"; then
            echo "::error::Godot import reported script compilation errors"
            exit 1
          fi

      - name: Run W05 combat contract
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          set +e
          "$GODOT_BIN" --headless --path . --script tests/ci/test_w05_combat_visuals.gd 2>&1 | tee "$test_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$test_log"; then
            echo "::error::W05 contract reported script/runtime errors"
            exit 1
          fi
          grep -Fxq 'W05_CONTRACT=r05-combat-visuals-v1' "$test_log"
          grep -Fxq 'W05_ASSET_SCENES=9' "$test_log"
          grep -Fxq 'W05_ENEMY_VARIANTS=3' "$test_log"
          grep -Fxq 'W05_WEAPON_DELIVERIES=6' "$test_log"
          grep -Fxq 'W05_CAUSAL_STAGES=5' "$test_log"
          grep -Fxq 'W05_COMBAT_VISUALS=PASS' "$test_log"

      - name: Render causal combat sequence
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          render_log="$(mktemp)"
          set +e
          xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --script tests/visual/capture_w05_combat_visuals.gd 2>&1 | tee "$render_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$render_log"; then
            echo "::error::W05 render reported script/runtime errors"
            exit 1
          fi
          grep -Fxq 'W05_RENDER=PASS' "$render_log"
          grep -Fxq 'W05_RENDER_SIZE=1280x720' "$render_log"
          grep -Fxq 'W05_RENDER_FRAMES=3' "$render_log"
          grep -Fxq 'W05_RENDER_HASHES_DISTINCT=PASS' "$render_log"
          test -s artifacts/w05/combat-trigger.png
          test -s artifacts/w05/combat-travel.png
          test -s artifacts/w05/combat-impact.png
          sha256sum artifacts/w05/combat-trigger.png artifacts/w05/combat-travel.png artifacts/w05/combat-impact.png

      - name: Upload W05 render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w05-combat-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/w05/combat-trigger.png
            artifacts/w05/combat-travel.png
            artifacts/w05/combat-impact.png
          if-no-files-found: error
          retention-days: 14
