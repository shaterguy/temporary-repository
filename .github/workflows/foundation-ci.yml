name: foundation-ci

on:
  push:
    branches:
      - 'v*-dev*'
      - 'v*-rc*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-fast-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ARCHIVE_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_ARCHIVE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      GODOT_BIN: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.engine.version' toolchain.lock)" = "$GODOT_VERSION"
          test "$(jq -r '.engine.linux_x86_64_sha256' toolchain.lock)" = "$GODOT_ARCHIVE_SHA256"
          test "$(jq -r '.identity.version_name' toolchain.lock)" = "1.0.0-dev1"
          test "$(jq -r '.identity.version_code' toolchain.lock)" = "1"
          grep -Fq 'const VERSION_NAME: String = "1.0.0-dev1"' game/core/build_identity.gd
          grep -Fq 'const VERSION_CODE: int = 1' game/core/build_identity.gd
          grep -Fq 'com.shaterguy.lanternfall.dev' game/core/build_identity.gd
          grep -Fq 'com.shaterguy.lanternfall' game/core/build_identity.gd
          test "$(jq -r '.release_gate.placeholder_assets_required' content_manifest.json)" = "0"
          test -z "$(find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -print -quit)"

      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --proto '=https' --tlsv1.2 "$GODOT_ARCHIVE_URL" --output /tmp/godot.zip
          echo "$GODOT_ARCHIVE_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import

      - name: Run foundation fast tests
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script tests/ci/test_main.gd
