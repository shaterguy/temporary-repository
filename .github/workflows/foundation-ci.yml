name: foundation-ci

on:
  push:
    branches:
      - 'v*-dev*'
      - 'v*-rc*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-fast-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ARCHIVE_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_ARCHIVE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      GODOT_BIN: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static contract preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.engine.version' toolchain.lock)" = "$GODOT_VERSION"
          test "$(jq -r '.engine.linux_x86_64_sha256' toolchain.lock)" = "$GODOT_ARCHIVE_SHA256"
          test "$(jq -r '.identity.version_name' toolchain.lock)" = "1.0.0-dev1"
          test "$(jq -r '.identity.version_code' toolchain.lock)" = "1"
          grep -Fq 'const VERSION_NAME: String = "1.0.0-dev1"' game/core/build_identity.gd
          grep -Fq 'const VERSION_CODE: int = 1' game/core/build_identity.gd
          grep -Fq 'com.shaterguy.lanternfall.dev' game/core/build_identity.gd
          grep -Fq 'com.shaterguy.lanternfall' game/core/build_identity.gd
          test "$(jq -r '.release_gate.placeholder_assets_required' content_manifest.json)" = "0"
          test "$(jq -r '.representative_art.w13.status' content_manifest.json)" = "runtime-integrated"
          test "$(jq -r '.representative_art.w13.runtime_asset_count' content_manifest.json)" = "15"
          test "$(jq -r '.assets | length' assets/runtime/w13/art_manifest.json)" = "15"
          test "$(jq '[.assets[] | select(.placeholder == true)] | length' assets/runtime/w13/art_manifest.json)" = "0"
          test -z "$(find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -print -quit)"

      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --proto '=https' --tlsv1.2 "$GODOT_ARCHIVE_URL" --output /tmp/godot.zip
          echo "$GODOT_ARCHIVE_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -euo pipefail
          import_log="$(mktemp)"
          set +e
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee "$import_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$import_log"; then
            echo "::error::Godot import reported script compilation errors"
            exit 1
          fi

      - name: Run foundation fast tests
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          set +e
          "$GODOT_BIN" --headless --path . --script tests/ci/test_main.gd 2>&1 | tee "$test_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$test_log"; then
            echo "::error::Godot fast tests reported script/runtime errors"
            exit 1
          fi
          if grep -Eq '^FAIL:|^RESULT=FAIL' "$test_log"; then
            echo "::error::Fast-test runner reported a failure"
            exit 1
          fi
          grep -Fxq 'TEST_CONTRACT=w13-representative-art-v1' "$test_log"
          grep -Fxq 'SUITES=14' "$test_log"
          grep -Fxq 'RESULT=PASS' "$test_log"

      - name: Render W13 representative art
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          mkdir -p artifacts/w13
          render_log="$(mktemp)"
          set +e
          xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --script tests/visual/capture_w13.gd 2>&1 | tee "$render_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$render_log"; then
            echo "::error::W13 render reported script/runtime errors"
            exit 1
          fi
          grep -Fxq 'W13_RENDER=PASS' "$render_log"
          grep -Fxq 'W13_RENDER_SIZE=1280x720' "$render_log"
          test -s artifacts/w13/representative-art.png
          sha256sum artifacts/w13/representative-art.png

      - name: Upload W13 render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w13-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/w13/representative-art.png
          if-no-files-found: error
          retention-days: 14
