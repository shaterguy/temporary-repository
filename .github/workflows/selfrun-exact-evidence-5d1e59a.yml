name: selfrun-exact-evidence-5d1e59a

on:
  push:
    branches:
      - 'ci/sr-20260913-5d1e59a-evidence'

permissions:
  contents: read

concurrency:
  group: selfrun-exact-evidence-5d1e59a
  cancel-in-progress: false

jobs:
  exact-candidate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: "5d1e59acdf776f2a7642ed21c517565c937e73cb"
      TARGET_TREE: "3cfb461a8362f7216b98f734f6d466464d9ea107"
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ARCHIVE_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_ARCHIVE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      GODOT_BIN: "/tmp/godot/Godot_v4.7.2-stable_linux.x86_64"
    steps:
      - name: Checkout immutable target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5d1e59acdf776f2a7642ed21c517565c937e73cb
          fetch-depth: 1

      - name: Lock source and test-contract identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(git hash-object .github/workflows/w06-medieval-ui-ci.yml)" = "bf16a12fabaeae5eef13a14d15e24d4410462bf5"
          test "$(git hash-object .github/workflows/w24-production-audio-ci.yml)" = "0a4514e442810988366555058c65e48f8cccd19d"
          test "$(git hash-object .github/workflows/w25-android-hardening-ci.yml)" = "777d94ab639b77e91e6fa142015b39324f5a807f"
          mkdir -p artifacts/selfrun
          {
            echo "TARGET_SHA=$(git rev-parse HEAD)"
            echo "TARGET_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "W06_WORKFLOW_BLOB=$(git hash-object .github/workflows/w06-medieval-ui-ci.yml)"
            echo "W24_WORKFLOW_BLOB=$(git hash-object .github/workflows/w24-production-audio-ci.yml)"
            echo "W25_WORKFLOW_BLOB=$(git hash-object .github/workflows/w25-android-hardening-ci.yml)"
            echo "TRIGGER_SHA=${GITHUB_SHA}"
            echo "TRIGGER_REF=${GITHUB_REF}"
          } | tee artifacts/selfrun/identity.txt

      - name: Shared pinned Godot preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.engine.version' toolchain.lock)" = "$GODOT_VERSION"
          test "$(jq -r '.engine.linux_x86_64_sha256' toolchain.lock)" = "$GODOT_ARCHIVE_SHA256"
          test "$(jq -r '.identity.version_name' toolchain.lock)" = "1.0.0-dev1"
          test "$(jq -r '.identity.version_code' toolchain.lock)" = "1"
          mkdir -p /tmp/godot
          curl --fail --location --proto '=https' --tlsv1.2 "$GODOT_ARCHIVE_URL" --output /tmp/godot.zip
          echo "$GODOT_ARCHIVE_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee artifacts/selfrun/godot-version.txt
          import_log="artifacts/selfrun/import.log"
          set +e
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee "$import_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:|Node not inside tree|GDScript backtrace' "$import_log"; then
            echo "::error::Godot import reported script/runtime errors"
            exit 1
          fi

      - name: W06 exact mobile-menu contract and fresh renders
        shell: bash
        run: |
          set -euo pipefail
          test -f game/ui/medieval_menu_readability.gd
          test -f tests/ci/test_w06_medieval_ui.gd
          test -f tests/visual/capture_w06_menu_readability.gd
          grep -Fq 'MenuDimmer' game/ui/main_shell.tscn
          grep -Fq 'MenuCard' game/ui/main_shell.tscn
          grep -Fq 'custom_minimum_size = Vector2(0, 80)' game/ui/main_shell.tscn
          grep -Fq 'W06_CONTRACT=r06-medieval-ui-readability-v1' tests/ci/test_w06_medieval_ui.gd
          grep -Fq 'Prior pre-rebuild readability PASS evidence is stale' docs/verification/R06_MEDIEVAL_UI.md
          test_log="artifacts/selfrun/w06-contract.log"
          set +e
          "$GODOT_BIN" --headless --path . --script tests/ci/test_w06_medieval_ui.gd 2>&1 | tee "$test_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:|Node not inside tree|GDScript backtrace' "$test_log"; then exit 1; fi
          grep -Fxq 'W06_CONTRACT=r06-medieval-ui-readability-v1' "$test_log"
          grep -Fxq 'W06_INPUT_BLOCK=PASS' "$test_log"
          grep -Fxq 'W06_MENU_STATE_TRANSITION=PASS' "$test_log"
          grep -Fxq 'W06_MEDIEVAL_UI=PASS' "$test_log"
          render_log="artifacts/selfrun/w06-render.log"
          set +e
          xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --script tests/visual/capture_w06_menu_readability.gd 2>&1 | tee "$render_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:|Node not inside tree|GDScript backtrace' "$render_log"; then exit 1; fi
          grep -Fxq 'W06_CAPTURE_1280x720=PASS' "$render_log"
          grep -Fxq 'W06_CAPTURE_2340x1080=PASS' "$render_log"
          grep -Fxq 'W06_CAPTURE_COUNT=4' "$render_log"
          grep -Fxq 'W06_CAPTURE=PASS' "$render_log"
          test -s artifacts/w06/slot-1280x720.png
          test -s artifacts/w06/hub-1280x720.png
          test -s artifacts/w06/slot-2340x1080.png
          test -s artifacts/w06/hub-2340x1080.png
          sha256sum artifacts/w06/*.png | tee artifacts/selfrun/w06-sha256.txt

      - name: W24 exact production-audio contract and listening bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/licenses/W07_CC0_AUDIO.md
          grep -Fq 'CC0 1.0 Universal' assets/licenses/W07_CC0_AUDIO.md
          test -f game/audio/external_audio_assets.gd
          test -f game/audio/audio_director.gd
          test -f game/ui/main_shell_w24.gd
          test -f game/ui/main_shell_medieval_rebuild.gd
          test -f tests/integration/w07_external_audio_smoke.gd
          test -f docs/verification/W07_EXTERNAL_AUDIO.md
          media_count="$(find assets/third_party/audio/w07 -type f \( -name '*.ogg' -o -name '*.mp3' -o -name '*.wav' \) | wc -l)"
          weapon_count="$(find assets/third_party/audio/w07/weapons -maxdepth 1 -type f -name '*.ogg' | wc -l)"
          ui_count="$(find assets/third_party/audio/w07/ui -maxdepth 1 -type f -name '*.ogg' | wc -l)"
          test "$media_count" -eq 29
          test "$weapon_count" -eq 18
          test "$ui_count" -eq 6
          (cd assets/third_party/audio/w07 && sha256sum --check --strict SHA256SUMS.txt)
          grep -Fq 'AudioDirector="*res://game/audio/audio_director.gd"' project.godot
          grep -Fq 'external_audio_assets.gd' game/audio/audio_director.gd
          ! grep -Fq 'ProductionAudio' game/audio/audio_director.gd
          ! grep -Fq 'AudioLibrary' game/audio/audio_director.gd
          ! grep -Fq 'render_cue(' game/audio/audio_director.gd
          grep -Fq 'MAX_ONE_SHOT_GAIN_DB: float = -6.0' game/audio/audio_director.gd
          test -z "$(find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' \) -print -quit)"
          test_log="artifacts/selfrun/w24-runtime.log"
          set +e
          "$GODOT_BIN" --headless --path . --script tests/integration/w07_external_audio_smoke.gd 2>&1 | tee "$test_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$test_log"; then exit 1; fi
          if grep -Eq '^FAIL:|^RESULT=FAIL' "$test_log"; then exit 1; fi
          grep -Fxq 'TEST_CONTRACT=w07-external-audio-v1' "$test_log"
          grep -Fxq 'W07_EXTERNAL_MEDIA=29' "$test_log"
          grep -Fxq 'W07_WEAPON_SFX_UNIQUE=18' "$test_log"
          grep -Fxq 'W07_BOSS_EVENT_CUES=50' "$test_log"
          grep -Fxq 'W07_PROCEDURAL_RUNTIME=DISABLED' "$test_log"
          grep -Fxq 'W07_LISTENING_REVIEW=REQUIRED' "$test_log"
          grep -Fxq 'RESULT=PASS' "$test_log"
          mkdir -p artifacts/w24-production-audio
          cp -R assets/third_party/audio/w07/. artifacts/w24-production-audio/
          cp assets/licenses/W07_CC0_AUDIO.md artifacts/w24-production-audio/
          cp docs/verification/W07_EXTERNAL_AUDIO.md artifacts/w24-production-audio/
          (cd artifacts/w24-production-audio && sha256sum --check --strict SHA256SUMS.txt)
          printf '%s\n' 'W24_PROCEDURAL_RUNTIME=DISABLED' 'W24_LISTENING_REVIEW=REQUIRED' > artifacts/w24-production-audio/SELF_RUN_REVIEW_STATE.txt

      - name: W25 exact Android hardening contract
        shell: bash
        run: |
          set -euo pipefail
          test -f game/ui/mobile_input_model.gd
          test -f game/ui/mobile_input_overlay.gd
          test -f game/ui/medieval_menu_readability.gd
          test -f game/ui/main_shell_medieval_rebuild.gd
          test -f tests/unit/test_w25_mobile_input.gd
          test -f tests/unit/test_w25_save_recovery.gd
          test -f tests/integration/w25_mobile_hardening_smoke.gd
          test -f docs/verification/W25_ANDROID_HARDENING.md
          grep -Fq 'res://game/ui/main_shell_medieval_rebuild.gd' game/ui/main_shell.tscn
          grep -Fq 'extends "res://game/ui/main_shell_w24.gd"' game/ui/main_shell_medieval_rebuild.gd
          grep -Fq 'res://game/ui/mobile_input_overlay.gd' game/ui/main_shell.tscn
          grep -Fq 'res://game/ui/medieval_menu_readability.gd' game/ui/main_shell.tscn
          grep -Fq '[node name="W25MobileControls" type="Control" parent="ScreenUI"]' game/ui/main_shell.tscn
          grep -Fq '[node name="TouchChoices" type="HBoxContainer" parent="ScreenUI/SafeArea/Content"]' game/ui/main_shell.tscn
          grep -Fq 'Choice1' game/ui/main_shell.tscn
          grep -Fq 'Choice2' game/ui/main_shell.tscn
          grep -Fq 'Choice3' game/ui/main_shell.tscn
          grep -Fq 'select_save_slot' game/ui/medieval_menu_readability.gd
          grep -Fq 'select_world_choice' game/ui/medieval_menu_readability.gd
          grep -Fq 'NOTIFICATION_APPLICATION_FOCUS_OUT' game/ui/mobile_input_overlay.gd
          grep -Fq 'NOTIFICATION_APPLICATION_PAUSED' game/ui/mobile_input_overlay.gd
          grep -Fq 'TEST_CONTRACT_PREFLIGHT=VALID' docs/verification/W25_ANDROID_HARDENING.md
          grep -Fq 'ACTION_PREFLIGHT=VALID' docs/verification/W25_ANDROID_HARDENING.md
          test_log="artifacts/selfrun/w25-smoke.log"
          set +e
          "$GODOT_BIN" --headless --path . --script tests/integration/w25_mobile_hardening_smoke.gd 2>&1 | tee "$test_log"
          godot_status=${PIPESTATUS[0]}
          set -e
          test "$godot_status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compile Error:|Parse Error:' "$test_log"; then exit 1; fi
          if grep -Eq '^W25_FAIL:|^W25_ANDROID_HARDENING=FAIL' "$test_log"; then exit 1; fi
          grep -Fxq 'W25_LAYOUT_MATRIX=1280x720,1600x720,1760x720,1024x768' "$test_log"
          grep -Fxq 'W25_PRE_EXPEDITION_TOUCH_NAV=PASS' "$test_log"
          grep -Fxq 'W25_MULTITOUCH=PASS' "$test_log"
          grep -Fxq 'W25_ACCESSIBILITY=PASS' "$test_log"
          grep -Fxq 'W25_LIFECYCLE_INPUT_RESET=PASS' "$test_log"
          grep -Fxq 'W25_SAVE_RECOVERY=PASS' "$test_log"
          grep -Fxq 'W25_ANDROID_HARDENING=PASS' "$test_log"

      - name: Upload W06 exact visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfrun-w06-5d1e59a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/w06/*.png
            artifacts/selfrun/identity.txt
            artifacts/selfrun/w06-contract.log
            artifacts/selfrun/w06-render.log
            artifacts/selfrun/w06-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload W24 exact listening evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfrun-w24-5d1e59a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/w24-production-audio
            artifacts/selfrun/identity.txt
            artifacts/selfrun/w24-runtime.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload W25 exact hardening evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfrun-w25-5d1e59a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/selfrun/identity.txt
            artifacts/selfrun/import.log
            artifacts/selfrun/godot-version.txt
            artifacts/selfrun/w25-smoke.log
          if-no-files-found: error
          retention-days: 14
